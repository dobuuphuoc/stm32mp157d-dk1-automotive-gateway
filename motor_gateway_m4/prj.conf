# AUTOSAR Classic M4 Firmware Configuration
CONFIG_GPIO=y
CONFIG_PWM=y
CONFIG_ADC=y
CONFIG_FPU=y

# Tat UART console vi nhan M4 khong dung chung cong UART4 voi Linux A7
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_RAM_CONSOLE=n

# OpenAMP + Resource Table + IPM for STM32MP157 IPCC Inter-Processor Communication
CONFIG_IPM=y
CONFIG_OPENAMP=y
CONFIG_OPENAMP_RSC_TABLE=y
CONFIG_OPENAMP_RSC_TABLE_NUM_RPMSG_BUFF=8
CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_MAIN_STACK_SIZE=2048
